<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f4f8;
            margin: 0;
            overflow: hidden;
        }

        .logo-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 300px;
        }

        /* Force both SVGs to be the exact same height so they are sized equally on the same line */
        svg {
            height: 120px;
            width: auto;
        }

        /* Both elements start at the exact same center position */
        .icon {
            position: absolute;
            z-index: 1; /* Pushed behind the text */
            transform: translateX(0);
            animation: slideIconLeft 1.5s cubic-bezier(0.25, 1, 0.4, 1) forwards;
            animation-delay: 0.5s;
        }

        .text {
            position: absolute;
            z-index: 2; /* First letter (and whole text) is now IN FRONT of the icon */
            opacity: 0;
            transform: translateX(0) scale(0.95);
            animation: slideTextRight 2s cubic-bezier(0.25, 1, 0.4, 1) forwards;
            animation-delay: 0.5s;
        }

        @keyframes slideIconLeft {
            0% {
                transform: translateX(0);
            }
            100% {
                /* Slides to the left */
                transform: translateX(-160px);
            }
        }

        @keyframes slideTextRight {
            0% {
                opacity: 0;
                transform: translateX(0) scale(0.95);
            }
            20% {
                opacity: 1; /* Fades in smoothly as it starts moving */
            }
            100% {
                opacity: 1;
                /* Slides to the right, heavily overlapping the icon */
                transform: translateX(10px) scale(1);
            }
        }
    </style>
